spring:
  application:
    name: wayrapass
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wayrapass_db}
    username: ${DB_USERNAME:wayrapass_user}
    password: ${DB_PASSWORD:WayraPass123!}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS_ENABLE:false}
      "[mail.smtp.connectiontimeout]": ${MAIL_CONNECTION_TIMEOUT_MS:5000}
      "[mail.smtp.timeout]": ${MAIL_READ_TIMEOUT_MS:5000}
      "[mail.smtp.writetimeout]": ${MAIL_WRITE_TIMEOUT_MS:5000}

server:
  port: ${SERVER_PORT:8081}

jwt:
  secret: ${JWT_SECRET:V2F5cmFQYXNzLWRldmVsb3BtZW50LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbi0yMDI2}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  simulator:
    enabled: ${WAYRAPASS_SIMULATOR_ENABLED:false}
    interval-seconds: ${WAYRAPASS_SIMULATOR_INTERVAL_SECONDS:5}
    interpolation-steps-per-segment: ${WAYRAPASS_SIMULATOR_INTERPOLATION_STEPS:5}
  mail:
    from: ${MAIL_FROM:no-reply@wayrapass.local}
  password-reset:
    expose-development-token: ${EXPOSE_PASSWORD_RESET_TOKEN:false}
  location:
    stale-after-seconds: ${LOCATION_STALE_AFTER_SECONDS:120}
